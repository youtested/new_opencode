[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-py"
version = "0.1.0"
description = "A pure-Python reimplementation of the opencode coding agent, targeting 32-bit ARM (armv7) phones running Termux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Direct deps only; the full install list incl. transitive pins is requirements.txt.
dependencies = [
    "httpx>=0.27,<0.29",
    "requests>=2.28,<3.0",
    "rich>=13.0,<16.0",
    "platformdirs>=4.0,<5.0",
    "click>=8.1,<9.0",
    "pygments>=2.16,<3.0",
]

[project.optional-dependencies]
tui = ["textual>=0.80,<9.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.21"]

[project.scripts]
opencode-py = "opencode_py.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opencode_py*"]

[tool.setuptools.package-data]
opencode_py = ["agent/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
